<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080b14"/>
      <stop offset="100%" style="stop-color:#0d1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="url(#accent)" stroke-width="24" opacity="0.3"/>
  <!-- Inner ring -->
  <circle cx="512" cy="512" r="280" fill="none" stroke="url(#accent)" stroke-width="16" opacity="0.5"/>
  <!-- C letter -->
  <text x="512" y="620" font-family="Arial Black,sans-serif" font-size="420" font-weight="900"
    text-anchor="middle" fill="url(#accent)">C</text>
  <!-- Bottom label -->
  <text x="512" y="880" font-family="Arial,sans-serif" font-size="72" font-weight="700"
    text-anchor="middle" fill="#475569" letter-spacing="12">CODEFORGE</text>
</svg>